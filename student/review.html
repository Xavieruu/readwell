<!DOCTYPE html>
<html lang="en" class="area-student">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review | ReadWell</title>
    <meta name="description" content="Look back at every question, your answer and the explanation.">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/reading.css">
    <link rel="stylesheet" href="../css/student.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="../" data-area="student" data-page="review" data-nav="progress">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" id="site-header"></header>

    <main id="main-content" tabindex="-1">
        <noscript><p class="noscript-note">ReadWell needs JavaScript turned on to work.</p></noscript>

        <section id="review-view" aria-labelledby="review-title" hidden>
            <div class="page-header">
                <div class="container">
                    <a class="back-link" id="back-results" href="results.html">&larr; Back to results</a>
                    <h1 id="review-title" tabindex="-1">Review</h1>
                    <p id="review-sub"></p>
                </div>
            </div>
            <div class="container section-body stack">
                <section class="card" aria-labelledby="filter-heading">
                    <h2 id="filter-heading">Show questions</h2>
                    <div class="segmented" id="filter-buttons" role="group" aria-label="Which questions to show">
                        <button type="button" class="btn btn-secondary" data-filter="all" aria-pressed="true">All questions</button>
                        <button type="button" class="btn btn-secondary" data-filter="incorrect" aria-pressed="false">Only incorrect</button>
                    </div>
                    <p class="field-hint" id="filter-note" role="status"></p>
                </section>

                <ol class="review-list" id="review-list" aria-label="Questions"></ol>

                <div class="button-row">
                    <a class="btn btn-primary" id="retry-link" href="reading.html">Try Again (practice)</a>
                    <a class="btn btn-secondary" id="results-link" href="results.html">Back to results</a>
                </div>
            </div>
        </section>

        <section id="notice-view" hidden>
            <div class="page-header"><div class="container"><h1 tabindex="-1">Review not found</h1></div></div>
            <div class="container section-body">
                <div class="card card-narrow">
                    <p id="notice-text">We could not find that attempt.</p>
                    <p><a href="reading.html">Go to Reading Activities</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/icons.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../activities/passages-data.js"></script>
    <script src="../activities/questions-data.js"></script>
    <script src="../activities/activities-data.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/questions.js"></script>
    <script src="../js/review.js"></script>
    <script src="../js/lottie-slots.js"></script>
</body>
</html>
