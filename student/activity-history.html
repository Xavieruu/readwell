<!DOCTYPE html>
<html lang="en" class="area-student">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activity History | ReadWell</title>
    <meta name="description" content="Every attempt you have finished.">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/reading.css">
    <link rel="stylesheet" href="../css/student.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="../" data-area="student" data-page="history" data-nav="history">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" id="site-header"></header>

    <main id="main-content" tabindex="-1">
        <noscript><p class="noscript-note">ReadWell needs JavaScript turned on to work.</p></noscript>

        <div class="page-header">
            <div class="container">
                <h1 id="page-title" tabindex="-1">Activity History</h1>
                <p>Every attempt you have finished. Nothing here is ever deleted.</p>
            </div>
        </div>
        <div class="container section-body stack">
            <div id="empty" class="card empty-card" hidden>
                <h2>Nothing here yet</h2>
                <p>You have not finished any activities yet.</p>
                <p><a class="btn btn-primary" href="reading.html">Start reading</a></p>
            </div>
            <section class="card" id="list-card" aria-labelledby="h-list" hidden>
                <h2 id="h-list">Finished attempts</h2>
                <div class="field-row">
                    <label for="filter">Show</label>
                    <select id="filter">
                        <option value="all">All attempts</option>
                        <option value="original">Original attempts</option>
                        <option value="practice">Practice attempts</option>
                    </select>
                </div>
                <ul class="story-list" id="history-list"></ul>
            </section>
        </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../activities/passages-data.js"></script>
    <script src="../activities/questions-data.js"></script>
    <script src="../activities/activities-data.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/questions.js"></script>
    <script src="../js/progress.js"></script>
    <script src="../js/activity-history.js"></script>
</body>
</html>
