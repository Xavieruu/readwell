<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parent login | ReadWell</title>
    <meta name="description" content="Log in to your ReadWell parent account.">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/public.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="../" data-area="public" data-page="parent-login">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" id="site-header"></header>

    <main id="main-content" class="stage" tabindex="-1">
        <noscript><p class="noscript-note">ReadWell needs JavaScript turned on to work.</p></noscript>

        <p class="wordmark" aria-hidden="true">ReadWell</p>

        <div class="card">
            <h1 class="card-title">Parent Login</h1>

            <form id="login-form" novalidate>
                <div class="alert alert-error" id="form-alert" role="alert" hidden>
                    <strong class="alert-label">Problem:</strong> <span id="form-alert-text"></span>
                </div>

                <div class="form-field">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" autocomplete="email" aria-describedby="login-email-error" required>
                    <p class="field-error" id="login-email-error" hidden></p>
                </div>

                <div class="form-field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" aria-describedby="login-password-error" required>
                    <p class="field-error" id="login-password-error" hidden></p>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="show-password">
                    <label for="show-password">Show password</label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Log In</button>
                    <a class="link-subtle" href="account-recovery.html?type=parent">Forgot your account code?</a>
                </div>
            </form>

            <div class="card-links">
                <p>Don't have an account? <a href="parent-register.html">Sign up.</a></p>
                <p>Are you a student? <a href="../student/student-login.html">Student login</a></p>
            </div>
        </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/parent-login.js"></script>
</body>
</html>
