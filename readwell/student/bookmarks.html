<!DOCTYPE html>
<html lang="en" class="area-student">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookmarks | ReadWell</title>
    <meta name="description" content="Stories you saved to read again.">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/reading.css">
    <link rel="stylesheet" href="../css/student.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="../" data-area="student" data-page="bookmarks" data-nav="bookmarks">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" id="site-header"></header>

    <main id="main-content" tabindex="-1">
        <noscript><p class="noscript-note">ReadWell needs JavaScript turned on to work.</p></noscript>

        <div class="page-header">
            <div class="container">
                <h1 id="page-title" tabindex="-1">Bookmarks</h1>
                <p>Stories you saved to read again.</p>
            </div>
        </div>
        <div class="container section-body stack">
            <div id="empty" class="card empty-card" hidden>
                <h2>No bookmarks yet</h2>
                <p>Press <strong>Bookmark</strong> on any story to save it here.</p>
                <p><a class="btn btn-primary" href="reading.html">Choose a story</a></p>
            </div>
            <section class="card" id="list-card" aria-labelledby="h-list" hidden>
                <h2 id="h-list">Saved stories</h2>
                <ul class="story-list" id="bookmark-list"></ul>
            </section>
        </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../activities/passages-data.js"></script>
    <script src="../activities/questions-data.js"></script>
    <script src="../activities/activities-data.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/questions.js"></script>
    <script src="../js/bookmarks.js"></script>
</body>
</html>
