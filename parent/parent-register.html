<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parent sign up | ReadWell</title>
    <meta name="description" content="Create a ReadWell parent account to add and manage your children's reading profiles.">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/public.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="../" data-area="public" data-page="parent-register">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" id="site-header"></header>

    <main id="main-content" class="stage" tabindex="-1">
        <noscript><p class="noscript-note">ReadWell needs JavaScript turned on to work.</p></noscript>

        <p class="wordmark" aria-hidden="true">ReadWell</p>

        <div class="card">
            <h1 class="card-title">Parent Sign Up</h1>

            <form id="register-form" novalidate>
                <div class="alert alert-error" id="form-alert" role="alert" hidden>
                    <strong class="alert-label">Problem:</strong> <span id="form-alert-text"></span>
                </div>

                <div class="form-field">
                    <label for="parent-name">Full name</label>
                    <input type="text" id="parent-name" name="name" autocomplete="name" aria-describedby="parent-name-error" required>
                    <p class="field-error" id="parent-name-error" hidden></p>
                </div>

                <div class="form-field">
                    <label for="parent-email">Email</label>
                    <input type="email" id="parent-email" name="email" autocomplete="email" aria-describedby="parent-email-error" required>
                    <p class="field-error" id="parent-email-error" hidden></p>
                </div>

                <div class="form-field">
                    <label for="parent-password">Password</label>
                    <input type="password" id="parent-password" name="password" autocomplete="new-password" aria-describedby="parent-password-hint parent-password-error" required>
                    <p class="field-hint" id="parent-password-hint">At least 8 characters.</p>
                    <p class="field-error" id="parent-password-error" hidden></p>
                </div>

                <div class="form-field">
                    <label for="parent-confirm">Confirm password</label>
                    <input type="password" id="parent-confirm" name="confirm" autocomplete="new-password" aria-describedby="parent-confirm-error" required>
                    <p class="field-error" id="parent-confirm-error" hidden></p>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="show-password">
                    <label for="show-password">Show passwords</label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </div>
            </form>


            <div class="or-divider" aria-hidden="true"><span>or</span></div>
            <button type="button" class="btn btn-google" id="google-button"><svg class="google-g" width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> Continue with Google</button>
            <p class="save-note" id="google-note" role="status"></p>

            <div class="card-links">
                <p>Already have an account? <a href="parent-login.html">Log in.</a></p>
                <p>Are you a student? <a href="../student/student-login.html">Student login</a></p>
            </div>
        </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/icons.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/parent-register.js"></script>
    <script src="../js/lottie-slots.js"></script>
    <script type="module" src="../js/firebase-init.js"></script>
</body>
</html>
